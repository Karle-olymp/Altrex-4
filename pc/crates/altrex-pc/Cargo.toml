[package]
name = "altrex-pc"
description = "Altrex pour PC : Forge, l'agent de programmation, avec des modèles locaux et cloud."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "altrex-pc"
path = "src/main.rs"

[dependencies]
altrex-core = { path = "../altrex-core" }
serde_json = { version = "1", features = ["preserve_order"] }
# Sans « default_fonts » : seules les polices d'Altrex (Manrope, JetBrains Mono, SIL OFL 1.1) sont embarquées.
eframe = { version = "0.29", default-features = false, features = ["glow", "x11", "wayland"] }
