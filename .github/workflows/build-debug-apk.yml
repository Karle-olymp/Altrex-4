name: Build Altrex APK

on:
  workflow_dispatch:
  # [ALTREX] Pull requests: tests and build only, nothing is published.
  pull_request:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1

      # [ALTREX] The same signing key for every build, so that a new APK installs over the old one
      # (a new key each time forced an uninstall: models, chats and memory lost). The key comes from
      # the ALTREX_DEBUG_KEYSTORE_B64 secret (base64 of debug.keystore, passwords "android"). Without
      # the secret a throwaway key is generated, as before, with a warning.
      - name: Debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ALTREX_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::ALTREX_DEBUG_KEYSTORE_B64 is not set: this APK gets a new key and will not install over the previous one."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Publish APK as a GitHub Release (avoids Actions artifact storage quota)
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: debug-latest
          name: "Altrex Debug APK (latest)"
          # [ALTREX] Named altrex-*.apk by app/build.gradle.kts (base.archivesName).
          artifacts: "app/build/outputs/apk/debug/altrex-debug.apk"
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # [ALTREX] Release build (R8 + resource shrinking), on manual runs only: never on pull requests,
  # nothing published. Signed with the same debug key as above, so it installs over the debug
  # builds. The APK and its mapping.txt (needed to decode crash traces) are kept as a short-lived
  # workflow artifact.
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1

      - name: Debug keystore (shared signing key)
        env:
          KEYSTORE_B64: ${{ secrets.ALTREX_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
          else
            echo "::warning::ALTREX_DEBUG_KEYSTORE_B64 is not set: the release APK is left unsigned."
          fi

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Keep the release APK and its R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: altrex-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
